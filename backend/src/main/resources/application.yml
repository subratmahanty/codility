server:
  port: 8080

spring:
  data:
    mongodb:
      uri: mongodb://localhost:27017/doctor_appointment
      database: doctor_appointment
  
  security:
    jwt:
      secret: ${JWT_SECRET:mySecretKey}
      expiration: 86400000 # 24 hours in milliseconds

# Twilio Configuration
twilio:
  account-sid: ${TWILIO_ACCOUNT_SID:your_account_sid}
  auth-token: ${TWILIO_AUTH_TOKEN:your_auth_token}
  phone-number: ${TWILIO_PHONE_NUMBER:your_twilio_phone_number}

# Application specific configuration
app:
  cors:
    allowed-origins: http://localhost:3000
  scheduler:
    reminder-cron: "0 */15 * * * *" # Every 15 minutes
    status-update-cron: "0 0 * * * *" # Every hour

logging:
  level:
    com.docappointment: DEBUG
    org.springframework.security: DEBUG