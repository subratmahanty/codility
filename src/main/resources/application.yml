server:
  port: 8080

spring:
  application:
    name: flowable-spring-boot
  
  # Database Configuration
  datasource:
    url: jdbc:h2:mem:flowable;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password: password
  
  # JPA Configuration
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
    show-sql: false
  
  # H2 Console (for development)
  h2:
    console:
      enabled: true
      path: /h2-console

# Flowable Configuration
flowable:
  # Process Engine Configuration
  process:
    definition-cache-limit: 10
  
  # Database Configuration
  database-schema-update: true
  
  # IDM (Identity Management) Configuration
  idm:
    enabled: true
    password-encoder: spring_bcrypt

# Logging Configuration
logging:
  level:
    org.flowable: DEBUG
    org.springframework.security: DEBUG
    com.example.flowable: DEBUG