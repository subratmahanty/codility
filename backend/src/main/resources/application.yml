server:
  port: 8080
  servlet:
    context-path: /api

spring:
  application:
    name: workflow-platform
  
  profiles:
    active: dev
  
  datasource:
    url: jdbc:h2:mem:flowable
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
  
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
        format_sql: true
  
  h2:
    console:
      enabled: true
      path: /h2-console

# Flowable Configuration
flowable:
  process:
    definition-cache-limit: 512
  task:
    app:
      rest-enabled: true
  modeler:
    app:
      rest-enabled: true
  form:
    app:
      rest-enabled: true
  dmn:
    enabled: true
    strict-mode: false
  async-executor-activate: true
  database-schema-update: true

# JWT Configuration
jwt:
  secret: "mySecretKey123456789012345678901234567890"
  expiration: 86400000 # 24 hours

# API Documentation
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha

# Logging
logging:
  level:
    com.workflowplatform: DEBUG
    org.flowable: INFO
    org.springframework.security: DEBUG
  pattern:
    console: "%d{HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"

# Management
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always